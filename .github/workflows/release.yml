name: Release

on:
  push:
    branches: [master]

# Один релиз за раз, чтобы параллельные пуши не конфликтовали при бампе версии
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Коммит с бампом версии помечен [skip ci] — защита от бесконечного цикла
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto latest master
        run: |
          git fetch origin master
          git rebase origin/master

      # ---------- Версионирование ----------
      # feat: -> minor, "type!:" или BREAKING CHANGE -> major, всё остальное -> patch
      # Формат в pubspec.yaml: MAJOR.MINOR.PATCH+BUILD
      - name: Bump version
        id: version
        run: |
          current=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//')
          name=${current%%+*}
          build=${current##*+}
          IFS=. read -r major minor patch <<< "$name"

          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before" 2>/dev/null; then
            range="HEAD~1..HEAD"
          else
            range="$before..HEAD"
          fi
          messages=$(git log "$range" --format='%s%n%b')

          if echo "$messages" | grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$messages" | grep -qE '^feat(\([^)]*\))?:'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          build=$((build + 1))

          # Push-уведомление только для значимых изменений: feat, fix и любой breaking
          # change. Для chore/docs/test уведомление не уходит, релиз виден при обычной проверке.
          if echo "$messages" | grep -qE '^(feat|fix)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
            notify=true
          else
            notify=false
          fi

          new_name="$major.$minor.$patch"
          sed -i -E "s/^version:.*/version: $new_name+$build/" pubspec.yaml

          echo "name=$new_name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=v$new_name" >> "$GITHUB_OUTPUT"
          echo "notify=$notify" >> "$GITHUB_OUTPUT"
          echo "Version: $current -> $new_name+$build (notify=$notify)"

      # ---------- Сборка ----------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # NDK закреплён в android/app/build.gradle.kts; на чистом раннере его нет,
      # а Gradle не может поставить его без принятых лицензий
      - name: Install Android NDK
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root" ]; then
            echo "::error::Android SDK не найден (ANDROID_HOME='${ANDROID_HOME}', ANDROID_SDK_ROOT='${ANDROID_SDK_ROOT}')"
            exit 1
          fi
          sdkmanager=$(command -v sdkmanager || ls "$sdk_root"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager не найден (ANDROID_HOME=$sdk_root)"
            ls -la "$sdk_root" "$sdk_root/cmdline-tools" || true
            exit 1
          fi
          echo "sdkmanager: $sdkmanager"

          ndk=$(grep -oE 'ndkVersion = "[^"]+"' android/app/build.gradle.kts | cut -d'"' -f2)
          if [ -z "$ndk" ]; then
            echo "::error::ndkVersion не найден в android/app/build.gradle.kts"
            exit 1
          fi

          set +o pipefail
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" --sdk_root="$sdk_root" "ndk;$ndk"

          test -d "$sdk_root/ndk/$ndk" || { echo "::error::NDK $ndk не установился"; ls "$sdk_root/ndk" || true; exit 1; }

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет ANDROID_KEYSTORE_BASE64 не задан. Без постоянной подписи обновления поверх установленной версии не встанут."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "SciList-${{ steps.version.outputs.tag }}.apk"

      # ---------- Публикация ----------
      # Коммит и тег пушим только после успешной сборки, иначе при падении остаётся тег без релиза
      - name: Commit version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push --atomic origin HEAD:master "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "SciList-${{ steps.version.outputs.tag }}.apk" \
            --title "SciList ${{ steps.version.outputs.tag }}" \
            --generate-notes

      # ---------- Push-уведомление о релизе ----------
      # Только после создания релиза: иначе пользователь тапнет по уведомлению,
      # а APK ещё не загружен. continue-on-error: ошибка push не должна
      # делать красным уже выпущенный релиз.
      #
      # Сервисный аккаунт нужен в двух ролях: Firebase Cloud Messaging API Admin
      # (отправка) и Service Account Token Creator на самом себе (выпуск
      # OAuth-токена, иначе auth не сможет его mint'ить).
      - name: Read service account email
        id: service-account
        if: steps.version.outputs.notify == 'true'
        continue-on-error: true
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "email=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          email=$(printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" | jq -r '.client_email // empty')
          if [ -z "$email" ]; then
            echo "::warning::В FCM_SERVICE_ACCOUNT_JSON нет client_email"
          fi
          echo "email=$email" >> "$GITHUB_OUTPUT"

      # token_format: access_token обязателен. Без него auth_token для ключа
      # сервисного аккаунта — самоподписанный JWT, а FCM v1 ждёт OAuth-токен
      # и отвечает 401.
      - name: Authenticate in Google Cloud
        id: gcp-auth
        if: steps.version.outputs.notify == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: false
          service_account: ${{ steps.service-account.outputs.email }}
          token_format: access_token

      - name: Notify about release
        id: notify
        if: steps.version.outputs.notify == 'true'
        continue-on-error: true
        env:
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -z "$FCM_PROJECT_ID" ] || [ -z "$FCM_TOKEN" ]; then
            echo "::warning::Секреты FCM_PROJECT_ID / FCM_SERVICE_ACCOUNT_JSON не заданы или токен не выпущен, уведомление не отправлено"
            exit 0
          fi

          # Тег формируется шагом Bump version и состоит из цифр и точек,
          # поэтому экранировать его для JSON не нужно
          payload=$(cat <<JSON
          {
            "message": {
              "topic": "updates",
              "notification": {
                "title": "SciList ${RELEASE_TAG}",
                "body": "Доступно обновление ${RELEASE_TAG}"
              },
              "data": { "version": "${RELEASE_TAG}" }
            }
          }
          JSON
          )

          curl --fail-with-body -sS -X POST \
            "https://fcm.googleapis.com/v1/projects/${FCM_PROJECT_ID}/messages:send" \
            -H "Authorization: Bearer ${FCM_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload"

      # continue-on-error прячет ошибки, а релиз при этом зелёный.
      # Поэтому результат push-шагов выводится в summary прогона.
      - name: Report push status
        if: always() && steps.version.outputs.notify == 'true' && steps.release.outcome == 'success'
        continue-on-error: true
        env:
          ACCOUNT_OUTCOME: ${{ steps.service-account.outcome }}
          ACCOUNT_EMAIL: ${{ steps.service-account.outputs.email }}
          AUTH_OUTCOME: ${{ steps.gcp-auth.outcome }}
          AUTH_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
        run: |
          {
            echo "### Push-уведомление о релизе"
            echo ""
            if [ "$ACCOUNT_OUTCOME" != "success" ] || [ -z "$ACCOUNT_EMAIL" ]; then
              echo "- ⚠️ Не прочитан email сервисного аккаунта. Проверьте секрет \`FCM_SERVICE_ACCOUNT_JSON\`."
            fi
            if [ "$AUTH_OUTCOME" != "success" ] || [ -z "$AUTH_TOKEN" ]; then
              echo "- ⚠️ OAuth-токен не выпущен, уведомление не отправлено. Нужна роль *Service Account Token Creator* на самом сервисном аккаунте. Лог: \`Authenticate in Google Cloud\`."
            fi
            if [ "$NOTIFY_OUTCOME" = "success" ]; then
              echo "- ✅ Уведомление отправлено в топик \`updates\`."
            else
              echo "- ⚠️ Запрос в FCM не прошёл, уведомление не отправлено. Лог: \`Notify about release\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
